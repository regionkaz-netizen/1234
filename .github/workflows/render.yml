name: Render WAKASI New Year Reel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render.yml'
      - 'src/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render 15-second vertical MP4
        run: npm run render -- --concurrency=2
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: wakasi-new-year-reel-mp4
          path: out/wakasi-new-year-reel.mp4
          if-no-files-found: error
